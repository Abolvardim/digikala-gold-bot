name: Schedule Diagnostic

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/schedule-diagnostic.yml"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Report scheduler heartbeat
        run: |
          echo "Schedule diagnostic started"
          echo "UTC time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Ref: ${GITHUB_REF}"
